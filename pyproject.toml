[project]
name = "receipts"
version = "0.1.0"
description = "Verify what a coding agent actually did, from its own execution trace."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
receipts = "receipts.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts"]
artifacts = ["src/receipts/report_template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
