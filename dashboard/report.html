<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts — 8 runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#FAFBFC; --surface:#FFFFFF; --surface-2:#F1F4F8;
  --ink:#11151C; --ink-2:#3C4657; --ink-dim:#68738A;
  --rule:#DCE2EB; --rule-soft:#EBEFF5;
  --bad:#B3261E; --bad-soft:#FBE9E7; --bad-line:#E0776E;
  --warn:#9A5B00; --warn-soft:#FDF1DF;
  --good:#0B6E4F; --good-soft:#E2F2EC; --good-line:#4FAE8C;
  --accent:#0F62FE; --focus:#FFD54A33;
  --f-sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0A0D12; --surface:#111620; --surface-2:#161C27;
    --ink:#E7ECF3; --ink-2:#B4BECD; --ink-dim:#8590A3;
    --rule:#232A37; --rule-soft:#1B212C;
    --bad:#F2857A; --bad-soft:#2A1614; --bad-line:#A64B41;
    --warn:#E3A45A; --warn-soft:#241B10;
    --good:#4FC4A0; --good-soft:#0F2620; --good-line:#2E7A63;
    --accent:#6E9BFF; --focus:#FFD54A22;
  }
}
:root[data-theme="dark"]{
  --ground:#0A0D12; --surface:#111620; --surface-2:#161C27;
  --ink:#E7ECF3; --ink-2:#B4BECD; --ink-dim:#8590A3;
  --rule:#232A37; --rule-soft:#1B212C;
  --bad:#F2857A; --bad-soft:#2A1614; --bad-line:#A64B41;
  --warn:#E3A45A; --warn-soft:#241B10;
  --good:#4FC4A0; --good-soft:#0F2620; --good-line:#2E7A63;
  --accent:#6E9BFF; --focus:#FFD54A22;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:36px 24px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

.brand{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-dim)}
h1{font-size:2rem;font-weight:600;letter-spacing:-.02em;margin:10px 0 0;max-width:22ch}
.sub{color:var(--ink-2);margin:12px 0 0;max-width:64ch}
h2{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-dim);margin:40px 0 13px}

/* ---- overview ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;
  margin:34px 0 0;background:var(--rule);border:1px solid var(--rule);border-radius:5px;
  overflow:hidden}
.stat{background:var(--surface);padding:17px 19px}
.stat .n{font-family:var(--f-mono);font-size:1.95rem;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-dim);margin-top:8px}
.stat.bad .n{color:var(--bad)} .stat.good .n{color:var(--good)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:13px}
.card{display:block;width:100%;background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--rule);border-radius:5px;padding:16px 18px;
  transition:border-color .12s ease,transform .12s ease}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card.diverged{border-left-color:var(--bad)}
.card.clean{border-left-color:var(--good-line)}
.card-top{display:flex;align-items:baseline;gap:9px}
.name{font-family:var(--f-mono);font-size:14px;font-weight:600;overflow-wrap:anywhere}
.pill{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap;flex:0 0 auto}
.pill.diverged{color:var(--bad);background:var(--bad-soft)}
.pill.clean{color:var(--good);background:var(--good-soft)}
.card-top .pill{margin-left:auto}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--surface-2);padding:3px 7px;border-radius:3px}

.strip{display:flex;gap:2px;margin:14px 0 0;height:15px}
.strip i{flex:1 1 auto;min-width:2px;border-radius:1px;background:var(--rule)}
.strip i.ok{background:var(--good-line);opacity:.45}
.strip i.error{background:var(--warn);opacity:.5}
.strip i.flag{background:var(--bad)}

.fline{margin:12px 0 0;font-size:13.5px;color:var(--ink-2);display:flex;gap:7px;
  align-items:flex-start}
.sev{font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 5px;border-radius:2px;flex:0 0 auto;margin-top:3px}
.sev.high{color:var(--bad);background:var(--bad-soft)}
.sev.medium{color:var(--warn);background:var(--warn-soft)}
.sev.low{color:var(--ink-dim);background:var(--surface-2)}
.nofind{margin:12px 0 0;font-size:13.5px;color:var(--ink-dim)}
.facts{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 0;padding-top:11px;
  border-top:1px solid var(--rule-soft);font-family:var(--f-mono);font-size:11px;
  color:var(--ink-dim);font-variant-numeric:tabular-nums}

/* ---- detail ---- */
.back{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);padding:6px 0;
  display:inline-flex;gap:8px;align-items:center}
.back:hover{color:var(--accent)}
header.top{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-top:14px;
  padding-bottom:18px;border-bottom:1px solid var(--rule)}
header.top h1{font-size:1.5rem;margin:6px 0 0}
.spacer{flex:1 1 auto}
.verdict{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 13px;border-radius:3px;white-space:nowrap}
.verdict.diverged{color:var(--bad);background:var(--bad-soft);
  border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.verdict.clean{color:var(--good);background:var(--good-soft);
  border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.meta{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0 0;font-family:var(--f-mono);
  font-size:12px;color:var(--ink-dim)}
.meta b{display:block;color:var(--ink);font-weight:600;font-size:14px;
  font-variant-numeric:tabular-nums;margin-top:2px}

.compare{display:grid;grid-template-columns:84px 1fr;gap:10px 16px;background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;padding:18px}
.compare dt{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-dim);padding-top:3px}
.compare dd{margin:0}
.claim{font-style:italic;color:var(--ink-2)}
.actual{font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}

.finding{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--rule);
  border-radius:5px;padding:16px 18px;margin-bottom:12px}
.finding.high{border-left-color:var(--bad)}
.finding.medium{border-left-color:var(--warn)}
.finding h3{margin:0;font-size:1rem;font-weight:600;display:flex;gap:10px;align-items:baseline}
.finding p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.evidence{margin:12px 0 0;padding:11px 0 0;list-style:none;border-top:1px solid var(--rule-soft);
  display:flex;flex-direction:column;gap:9px}
.ev{width:100%;border-radius:3px;padding:2px 4px;margin:-2px -4px}
.ev[data-seq]:hover{background:var(--surface-2)}
.ev-head{font-family:var(--f-mono);font-size:11px;color:var(--ink-dim)}
.ev-head .ref{color:var(--accent);font-weight:600}
.ev-body{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:3px;
  padding:7px 9px;margin-top:4px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere;
  color:var(--ink-2)}
.empty{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 25%,transparent);
  border-radius:5px;padding:18px;color:var(--good);font-size:14px}

ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{display:grid;grid-template-columns:44px 24px 1fr auto;gap:12px;align-items:baseline;
  padding:7px 10px;border-radius:3px;scroll-margin-top:24px}
ol.tl li.flagged{background:var(--bad-soft)}
ol.tl li.lit{box-shadow:0 0 0 2px var(--accent) inset;background:var(--focus)}
.seq{font-family:var(--f-mono);font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.rail{position:relative;justify-self:center;align-self:stretch;width:2px;background:var(--rule);
  border-radius:1px}
li.flagged .rail{background:var(--bad-line)}
.rail::after{content:"";position:absolute;left:50%;top:9px;width:7px;height:7px;
  transform:translateX(-50%);border-radius:50%;background:var(--rule);outline:3px solid var(--surface)}
li.flagged .rail::after{background:var(--bad-line)}
.what{font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}
.what .verb{color:var(--ink-dim);margin-right:8px}
.what .test-tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);
  background:var(--warn-soft);padding:1px 5px;border-radius:2px;margin-left:8px}
.out{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.out.ok{color:var(--good)} .out.error{color:var(--bad)} .out.unknown{color:var(--ink-dim)}

.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-top:14px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--good);
  animation:pulse 2s ease-in-out infinite}
.live.stale .dot{background:var(--warn);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes arrive{from{background:var(--focus);border-color:var(--accent)}to{}}
.card.fresh{animation:arrive 2.4s ease-out}
@media (prefers-reduced-motion:reduce){
  .live .dot{animation:none}
  .card.fresh{animation:none}
  .card:hover{transform:none}
}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule-soft);
  font-family:var(--f-mono);font-size:11px;color:var(--ink-dim);line-height:1.85}
@media (max-width:640px){
  .compare{grid-template-columns:1fr;gap:4px 0}
  ol.tl li{grid-template-columns:38px 20px 1fr;row-gap:2px}
  .out{grid-column:3}
}
</style>
</head>

let FRESH = new Set();

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, suffix = "") => (v === null || v === undefined) ? "—" : `${v}${suffix}`;
const byName = (n) => DATA.runs.find(r => r.name === n);

/* ---------------- overview ---------------- */

function statsBlock() {
  const t = DATA.totals;
  const cells = [
    ["runs audited", DATA.runs.length, ""],
    ["diverged", t.diverged, t.diverged ? "bad" : ""],
    ["clean", t.clean, "good"],
    ["findings", t.findings, ""],
  ];
  if (t.false_alarms !== null && t.false_alarms !== undefined) {
    cells.push(["false alarms", t.false_alarms, t.false_alarms ? "bad" : "good"]);
  }
  return `<div class="stats">${cells.map(([k, n, cls]) =>
    `<div class="stat ${cls}"><div class="n">${esc(n)}</div><div class="k">${esc(k)}</div></div>`
  ).join("")}</div>`;
}

function card(run) {
  const findings = run.findings.length
    ? run.findings.slice(0, 2).map(f =>
        `<div class="fline"><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>
         <span>${esc(f.title)}</span></div>`).join("")
    : `<div class="nofind">Summary matches the trace.</div>`;
  const facts = [
    `${run.files_written} written`,
    `${run.commands} command${run.commands === 1 ? "" : "s"}`,
    run.duration_ms ? `${(run.duration_ms / 1000).toFixed(1)}s` : null,
    run.cost ? `${run.cost.toFixed(3)} coins` : null,
  ].filter(Boolean);
  const strip = run.strip.length
    ? `<div class="strip" aria-hidden="true">${run.strip.map(s =>
        `<i class="${esc(s)}"></i>`).join("")}</div>` : "";

  return `<button class="card ${esc(run.verdict)}${FRESH.has(run.name) ? " fresh" : ""}" data-run="${esc(run.name)}">
    <span class="card-top">
      <span class="name">${esc(run.name)}</span>
      ${run.label ? `<span class="tag">${esc(run.label)}</span>` : ""}
      <span class="pill ${esc(run.verdict)}">${esc(run.verdict)}</span>
    </span>
    ${strip}${findings}
    <span class="facts">${facts.map(f => `<span>${esc(f)}</span>`).join("")}</span>
  </button>`;
}

function overview() {
  const order = { diverged: 0, clean: 1 };
  const runs = [...DATA.runs].sort((a, b) =>
    (order[a.verdict] - order[b.verdict]) || a.name.localeCompare(b.name));
  return `
    <div class="brand">Receipts</div>
    <h1>${esc(DATA.headline)}</h1>
    <p class="sub">${esc(DATA.subhead)}</p>
    ${DATA.live ? `<div class="live" id="live"><span class="dot"></span>
       <span id="live-text">watching for new traces</span></div>` : ""}
    ${statsBlock()}
    <h2>Runs</h2>
    <div class="grid">${runs.length
      ? runs.map(card).join("")
      : `<div class="nofind">No traces yet.</div>`}</div>
    ${footer()}`;
}

/* ---------------- one run ---------------- */

function metaRow(run) {
  const cells = [
    ["Agent", run.agent],
    ["Tool calls", num(run.tool_calls)],
    ["Cost", run.cost ? run.cost.toFixed(4) : "—"],
    ["Duration", run.duration_ms ? (run.duration_ms / 1000).toFixed(1) + "s" : "—"],
  ];
  return `<div class="meta">${cells.map(([k, v]) =>
    `<div>${esc(k)}<b>${esc(v)}</b></div>`).join("")}</div>`;
}

function findingsBlock(run) {
  if (!run.findings.length) {
    return `<section><h2>Findings</h2><div class="empty">
      No divergence found between the agent's summary and its execution trace.</div></section>`;
  }
  return `<section><h2>Findings</h2>${run.findings.map(f => `
    <article class="finding ${esc(f.severity)}">
      <h3><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>${esc(f.title)}</h3>
      <p>${esc(f.detail)}</p>
      <ul class="evidence">${(f.evidence || []).map(e => `
        <li><button class="ev" ${e.seq >= 0 ? `data-seq="${esc(e.seq)}"` : ""}>
          <span class="ev-head"><span class="ref">${e.seq >= 0 ? "line " + esc(e.seq) : "summary"}</span>
            &nbsp;· ${esc(e.label)}</span>
          ${e.excerpt ? `<span class="ev-body">${esc(e.excerpt)}</span>` : ""}
        </button></li>`).join("")}</ul>
    </article>`).join("")}</section>`;
}

function timelineBlock(run) {
  if (!run.timeline.length) return "";
  return `<section><h2>Execution trace</h2><ol class="tl">${run.timeline.map(r => `
    <li id="ev-${esc(r.seq)}" class="${r.flagged ? "flagged" : ""}">
      <span class="seq">${esc(r.seq)}</span>
      <span class="rail" aria-hidden="true"></span>
      <span class="what"><span class="verb">${esc(r.kind)}</span>${esc(r.detail)}${
        r.test ? '<span class="test-tag">test</span>' : ""}</span>
      <span class="out ${esc(r.outcome)}">${esc(r.outcome)}</span>
    </li>`).join("")}</ol></section>`;
}

function detail(run) {
  const diverged = run.verdict === "diverged";
  const failed = run.commands_detail.filter(c => c.outcome === "error").length;
  const actual = `${run.files_written} file(s) written · ${run.commands} command(s) run`
    + (failed ? ` · ${failed} failed` : "");
  return `
    <button class="back" data-back>← all runs</button>
    <header class="top">
      <div>
        <div class="brand">${esc(run.name)}</div>
        <h1>${diverged ? "The summary and the trace disagree" : "Summary matches the trace"}</h1>
      </div>
      <div class="spacer"></div>
      <div class="verdict ${esc(run.verdict)}">${esc(run.verdict)}</div>
    </header>
    ${metaRow(run)}
    <section><h2>Claim versus reality</h2>
      <dl class="compare">
        <dt>Claimed</dt><dd class="claim">${esc(run.claim) || "—"}</dd>
        <dt>Actual</dt><dd class="actual">${esc(actual)}</dd>
      </dl>
    </section>
    ${findingsBlock(run)}
    ${timelineBlock(run)}
    ${footer()}`;
}

function footer() {
  return `<footer>
    Every verdict is derived from the agent's own execution trace — no second model,
    no judgement call. Each finding cites the events that prove it.<br>
    Receipts v${esc(DATA.receipts_version)}${DATA.generated ? " · " + esc(DATA.generated) : ""}.
  </footer>`;
}

/* ---------------- routing ---------------- */

const app = document.getElementById("app");

function draw() {
  const name = decodeURIComponent((location.hash || "").replace(/^#run=/, ""));
  const run = name ? byName(name) : null;
  app.innerHTML = run ? detail(run) : overview();
  window.scrollTo(0, 0);
}

app.addEventListener("click", (event) => {
  const card = event.target.closest("[data-run]");
  if (card) { location.hash = "run=" + encodeURIComponent(card.dataset.run); return; }
  if (event.target.closest("[data-back]")) { location.hash = ""; return; }

  const ev = event.target.closest("[data-seq]");
  if (ev) {
    const row = document.getElementById("ev-" + ev.dataset.seq);
    if (!row) return;
    document.querySelectorAll("ol.tl li.lit").forEach(el => el.classList.remove("lit"));
    row.classList.add("lit");
    row.scrollIntoView({ behavior: "smooth", block: "center" });
  }
});

window.addEventListener("hashchange", draw);
draw();

/* When served by `receipts watch`, the board follows the traces directory. */
if (DATA.live) {
  let revision = DATA.revision;
  let missed = 0;

  const setState = (stale, text) => {
    const el = document.getElementById("live");
    if (!el) return;
    el.classList.toggle("stale", stale);
    const label = document.getElementById("live-text");
    if (label) label.textContent = text;
  };

  setInterval(async () => {
    try {
      const head = await fetch("/api/revision", { cache: "no-store" });
      const { revision: latest } = await head.json();
      missed = 0;
      if (latest === revision) { setState(false, "watching for new traces"); return; }

      const before = new Set(DATA.runs.map(r => r.name));
      const next = await (await fetch("/api/audit", { cache: "no-store" })).json();
      FRESH = new Set(next.runs.map(r => r.name).filter(n => !before.has(n)));
      DATA = next;
      revision = latest;
      draw();
      setState(false, FRESH.size
        ? `${FRESH.size} new run${FRESH.size === 1 ? "" : "s"} audited`
        : "audit updated");
      setTimeout(() => { FRESH = new Set(); }, 3000);
    } catch {
      /* The board is a convenience, not a dependency: if `receipts watch` has
         stopped, say so and keep the last audit on screen. */
      if (++missed >= 3) setState(true, "not connected — showing the last audit");
    }
  }, 1200);
}
