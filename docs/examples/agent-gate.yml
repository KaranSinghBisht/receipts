# Example: gate a pull request on what the agent actually did.
#
# Kept outside .github/workflows on purpose. It lived there briefly, with a
# comment claiming it was "deliberately not enabled" -- which was wrong, because
# GitHub runs every file in that directory regardless of its name, and it failed
# on every push. An unverified claim about our own configuration, in the repo of
# a tool built to catch unverified claims. Copy this into a repository that has
# an agent writing its code. The job assumes the trace was captured when the
# agent ran, e.g.
#
#     bob run --format stream-json "<task>" > traces/${{ github.sha }}.ndjson
#
# and committed or uploaded with the change.

name: agent gate

on:
  pull_request:

jobs:
  receipts:
    if: hashFiles('traces/*.ndjson') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install receipts-audit  # or: pip install git+https://…/receipts

      # Exit 1 on a high-severity finding, which fails the check and blocks the
      # merge. `--fail-on medium` is stricter; `--fail-on never` reports only.
      - name: Hold the agent to its trace
        run: |
          receipts traces/ --html receipts-report.html
          for trace in traces/*.ndjson; do
            receipts "$trace" --spec requirements.json --workspace . --fail-on high
          done

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: receipts-report
          path: receipts-report.html
