name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Receipts gating itself: every trace this repository ships is audited on
  # every push. The corpus is real output from IBM Bob, so a change that starts
  # reporting divergence where there was none fails here rather than in review.
  audit-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Audit the captured runs
        run: receipts corpus/bob --html report.html --labels study/labels.json
      - name: No control run may diverge
        run: python study/report_study.py --agent bob
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: receipts-report
          path: report.html
